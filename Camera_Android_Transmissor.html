<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Câmera Android - transmissor WebRTC</title><style>body{font:16px system-ui;margin:18px;max-width:800px;background:#eef3f5;color:#173442}section{background:white;padding:16px;border-radius:12px;margin:12px 0}video{width:100%;border-radius:8px;background:#111}textarea{width:100%;box-sizing:border-box;min-height:110px}button{padding:12px;margin:5px 4px 5px 0;border:0;border-radius:7px;background:#00695d;color:white;font:inherit}p{line-height:1.4}</style><h2>Câmera Android — Transmissor</h2><p>Abra esta página no Chrome Android usando HTTPS. Autorize a câmera. Para conectar, cole a oferta gerada no computador e envie a resposta de volta.</p><section><button id="start">1. Ligar câmera</button><button id="stop">Desligar</button><video id="video" autoplay playsinline muted></video><p id="status">Aguardando.</p></section><section><p>2. Cole a oferta gerada pelo computador:</p><textarea id="offer" placeholder="Cole aqui o código da oferta"></textarea><button id="answer">3. Gerar resposta</button><p>4. Copie a resposta e envie para o computador:</p><textarea id="result" readonly></textarea><button id="copy">Copiar resposta</button></section><script>
let stream=null,pc=null;const $=id=>document.getElementById(id),status=s=>$("status").textContent=s;
async function stop(){if(pc){pc.close();pc=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$("video").srcObject=null;status("Desligado.");}
$("start").onclick=async()=>{try{await stop();if(!navigator.mediaDevices?.getUserMedia)throw Error("Câmera indisponível. Use HTTPS e Chrome atualizado.");stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});$("video").srcObject=stream;await $("video").play();status("Câmera ligada. Cole a oferta do computador.");}catch(e){status("Erro: "+e.message);}};
$("stop").onclick=stop;
async function waitIce(peer){if(peer.iceGatheringState==="complete")return;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error("Tempo limite ICE")),18000);const check=()=>{if(peer.iceGatheringState==="complete"){clearTimeout(timer);peer.removeEventListener("icegatheringstatechange",check);resolve();}};peer.addEventListener("icegatheringstatechange",check);});}
$("answer").onclick=async()=>{try{if(!stream)throw Error("Ligue a câmera primeiro");if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onconnectionstatechange=()=>status("Conexão: "+pc.connectionState);const offer=JSON.parse($("offer").value);if(offer.type!=="offer"||!offer.sdp)throw Error("Oferta inválida");await pc.setRemoteDescription(offer);await pc.setLocalDescription(await pc.createAnswer());status("Preparando resposta...");await waitIce(pc);$("result").value=JSON.stringify(pc.localDescription);status("Resposta pronta. Copie e envie ao computador.");}catch(e){status("Erro: "+e.message);}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("result").value);status("Resposta copiada.");}catch(e){$("result").select();status("Selecione e copie manualmente.");}};
</script></html>
